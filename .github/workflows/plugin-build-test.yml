name: Extension Compile Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    name: Extension Compile Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make scripts executable
        run: chmod +x ./gradlew ./compileDebug ./compileRelease 2>/dev/null || true

      - name: Compile Debug
        run: ./compileDebug

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: output/*.zip
          if-no-files-found: error
